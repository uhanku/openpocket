<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>OpenRouter Spend</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section id="chartCard" class="chart-card">
      <header class="chart-topbar">
        <div class="chart-heading">
          <div class="heading-meta">
            <span id="rangeLabel" class="eyebrow">CURRENT MONTH</span>

            <span id="connectionStatus" class="connection-status demo">
              <span class="connection-dot"></span>
              <span id="connectionText">DEMO</span>
            </span>
          </div>
        </div>

        <div class="chart-actions">
          <div class="action-row">
            <div class="mode-switch" aria-label="Chart mode">
              <button
                id="dailyMode"
                class="mode-button active"
                type="button"
                aria-pressed="true"
              >
                Daily
              </button>

              <button
                id="compoundMode"
                class="mode-button"
                type="button"
                aria-pressed="false"
              >
                Compound
              </button>
            </div>

            <button
              id="refreshButton"
              class="refresh-button"
              type="button"
              title="Refresh OpenRouter usage"
              aria-label="Refresh OpenRouter usage"
            >
              <span aria-hidden="true">↻</span>
            </button>
          </div>

          <div class="legend" aria-label="Chart legend">
            <div class="legend-item">
              <span class="legend-box spending"></span>
              <span>Spending</span>
            </div>

            <div class="legend-item">
              <span class="legend-box warning"></span>
              <span>Near limit</span>
            </div>

            <div class="legend-item">
              <span class="legend-box over"></span>
              <span>Over</span>
            </div>

            <div class="legend-item">
              <span class="legend-line"></span>
              <span id="legendLineText">Daily limit</span>
            </div>
          </div>
        </div>
      </header>

      <div class="chart-wrap">
        <canvas
          id="spendingChart"
          role="img"
          aria-label="OpenRouter daily spending graph"
        ></canvas>

        <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>

        <div id="emptyState" class="empty-state" hidden>
          <strong>No usage data</strong>
          <span>OpenRouter returned no spending rows for this period.</span>
        </div>
      </div>
    </section>
  </main>

  <div
    class="resize-handle resize-nw"
    data-direction="NorthWest"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-n"
    data-direction="North"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-ne"
    data-direction="NorthEast"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-e"
    data-direction="East"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-se"
    data-direction="SouthEast"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-s"
    data-direction="South"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-sw"
    data-direction="SouthWest"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-w"
    data-direction="West"
    aria-hidden="true"
  ></div>

  <script src="app.js"></script>
</body>
</html>
