<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>OpenRouter Spend</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section id="chartCard" class="chart-card">
      <header class="chart-topbar">
        <div class="chart-heading">
          <div class="heading-meta">
            <span id="rangeLabel" class="eyebrow">CURRENT MONTH</span>

            <span id="connectionStatus" class="connection-status demo">
              <span class="connection-dot"></span>
              <span id="connectionText">DEMO</span>
            </span>
          </div>
        </div>

        <div class="chart-actions">
          <div class="action-row">
            <div class="mode-switch" aria-label="Chart mode">
              <button
                id="dailyMode"
                class="mode-button active"
                type="button"
                aria-pressed="true"
              >
                Daily
              </button>

              <button
                id="compoundMode"
                class="mode-button"
                type="button"
                aria-pressed="false"
              >
                Compound
              </button>
            </div>

            <button
              id="refreshButton"
              class="refresh-button"
              type="button"
              title="Refresh OpenRouter usage"
              aria-label="Refresh OpenRouter usage"
            >
              <span aria-hidden="true">↻</span>
            </button>

            <button
              id="settingsButton"
              class="settings-button"
              type="button"
              title="Settings"
              aria-label="Open settings"
            >
              <span aria-hidden="true">⚙</span>
            </button>
          </div>

          <div class="legend" aria-label="Chart legend">
            <div class="legend-item">
              <span class="legend-box spending"></span>
              <span>Spending</span>
            </div>

            <div class="legend-item">
              <span class="legend-box warning"></span>
              <span>Near limit</span>
            </div>

            <div class="legend-item">
              <span class="legend-box over"></span>
              <span>Over</span>
            </div>

            <div class="legend-item">
              <span class="legend-line"></span>
              <span id="legendLineText">Daily limit</span>
            </div>
          </div>
        </div>
      </header>

      <div class="chart-wrap">
        <canvas
          id="spendingChart"
          role="img"
          aria-label="OpenRouter daily spending graph"
        ></canvas>

        <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>

        <div id="emptyState" class="empty-state" hidden>
          <strong>No usage data</strong>
          <span>OpenRouter returned no spending rows for this period.</span>
        </div>
      </div>
    </section>
  </main>

  <div
    class="resize-handle resize-nw"
    data-direction="NorthWest"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-n"
    data-direction="North"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-ne"
    data-direction="NorthEast"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-e"
    data-direction="East"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-se"
    data-direction="SouthEast"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-s"
    data-direction="South"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-sw"
    data-direction="SouthWest"
    aria-hidden="true"
  ></div>
  <div
    class="resize-handle resize-w"
    data-direction="West"
    aria-hidden="true"
  ></div>

  <div
    id="settingsModal"
    class="settings-modal"
    hidden
    aria-hidden="true"
  >
    <div class="settings-backdrop" data-close-settings></div>
    <div
      class="settings-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <header class="settings-header">
        <h2 id="settingsTitle" class="settings-title">Settings</h2>
        <button
          id="settingsClose"
          class="settings-icon-close"
          type="button"
          aria-label="Close settings"
        >
          ✕
        </button>
      </header>

      <p class="settings-hint">
        Stored in
        <code>%APPDATA%\com.uhanku.openrouter-spend\settings.json</code>
        (plaintext). Env vars still override if set.
      </p>

      <label class="settings-label" for="settingsKeyInput"
        >OpenRouter Management Key</label
      >
      <div class="settings-field">
        <input
          id="settingsKeyInput"
          class="settings-input"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="sk-or-..."
        />
        <button
          id="toggleKeyVisibility"
          class="settings-mini-button"
          type="button"
          aria-label="Show key"
        >
          Show
        </button>
      </div>
      <div id="settingsKeyHint" class="settings-key-hint"></div>

      <label class="settings-label" for="settingsLimitInput"
        >Daily limit (USD)</label
      >
      <input
        id="settingsLimitInput"
        class="settings-input"
        type="number"
        min="0.01"
        step="0.01"
        inputmode="decimal"
        placeholder="0.67"
      />

      <div id="settingsStatus" class="settings-status" role="status" aria-live="polite"></div>

      <div class="settings-actions">
        <button id="settingsClearKey" class="settings-secondary" type="button">
          Clear key
        </button>
        <button id="settingsResetLimit" class="settings-secondary" type="button">
          Reset limit
        </button>
        <span class="settings-spacer"></span>
        <button id="settingsCancel" class="settings-secondary" type="button">
          Cancel
        </button>
        <button id="settingsSave" class="settings-primary" type="button">
          Save
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
